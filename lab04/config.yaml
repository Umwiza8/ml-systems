
dataset:
  name: Adult Census Income
  source: UCI Adult dataset via OpenML
  target: class

split:
  test_size: 0.30
  random_state: 42
  stratify: true

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  clipping_lower_percentile: 0.01
  clipping_upper_percentile: 0.99
  scaling: StandardScaler
  encoding: OneHotEncoder
  handle_unknown: ignore
  remove_training_duplicates: true
  preserve_test_duplicates: true

feature_engineering:
  - capital_net
  - hours_per_age

model:
  name: LogisticRegression
  max_iter: 1000
  random_state: 42

evaluation:
  metrics:
    - accuracy
    - f1_score
  positive_class: ">50K"

audit:
  sample_size: 50
  random_state: 42
